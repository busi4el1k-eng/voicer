# Cinema Dub (voicer) — deployed on the same droplet as digital_standarts.
# The shared nginx:alpine container from the digital_standarts stack owns
# 80/443 and proxies dubthatmovie.com to this service by its network alias
# (voicer-web) over the shared external network.
#
# Secrets are NOT in this file — compose interpolates ${VARS} from a sibling
# `.env` file that lives ONLY on the server (gitignored).
services:
  voicer-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
        NEXT_PUBLIC_SPACES_PUBLIC_BASE: ${NEXT_PUBLIC_SPACES_PUBLIC_BASE}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        # Baked into the client bundle at build time; empty ⇒ analytics disabled.
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        # Google AdSense (also build-time). CLIENT falls back to a hardcoded
        # publisher id in code; SLOT_RAIL is empty until the ad unit is created.
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT}
        NEXT_PUBLIC_ADSENSE_SLOT_RAIL: ${NEXT_PUBLIC_ADSENSE_SLOT_RAIL}
    restart: unless-stopped
    # Each realtime (SSE) player holds one long-lived connection = one file
    # descriptor. The default 1024 soft limit caps concurrent players at ~1k;
    # raise it (hard limit is already 524288) so the box's real headroom — not a
    # config default — sets the ceiling.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_PREFIX=${DO_SPACES_PREFIX}
      - NEXT_PUBLIC_SPACES_PUBLIC_BASE=${NEXT_PUBLIC_SPACES_PUBLIC_BASE}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
      - NEXT_PUBLIC_ADSENSE_CLIENT=${NEXT_PUBLIC_ADSENSE_CLIENT}
      - NEXT_PUBLIC_ADSENSE_SLOT_RAIL=${NEXT_PUBLIC_ADSENSE_SLOT_RAIL}
      - DEMUCS_URL=${DEMUCS_URL}
      - DEMUCS_API_KEY=${DEMUCS_API_KEY}
      # AI auto-detect (optional): AssemblyAI transcribes, Anthropic corrects the
      # speaker labels. Without these in the server .env, auto-detect stays off.
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Upstash Redis (optional): fans out live room events across app instances
      # so SSE keeps working when running more than one. Single instance ignores it.
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    networks:
      - shared

networks:
  shared:
    external: true
    name: digital_standarts_default
